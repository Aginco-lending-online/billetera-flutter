name: billetera_flutter
description: >
  Paquete Flutter para abrir billetera-widget en un WebView con los datos de
  persona (DNI, género, correo, celular, tenant). URL base configurable por entorno.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
