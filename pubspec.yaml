name: billetera_flutter
description: >
  Paquete Flutter de integración para abrir billetera-widget en un WebView.
  El DNI es obligatorio y el tenant es imprescindible para crear la solicitud;
  género, correo, celular e idEntidad son opcionales. URL base configurable
  por entorno.
version: 0.2.1
publish_to: none

repository: https://github.com/Aginco-lending-online/billetera-flutter
issue_tracker: https://github.com/Aginco-lending-online/billetera-flutter/issues

environment:
  # PopScope.onPopInvokedWithResult, usado para el botón atrás, requiere 3.24.
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
