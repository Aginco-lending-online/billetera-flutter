name: billetera_flutter
description: >
  SDK Flutter para abrir billetera-widget en un WebView. Solo el DNI es
  obligatorio; género, correo, celular, tenant e idEntidad son opcionales.
  URL base configurable por entorno.
version: 0.2.0
publish_to: none

environment:
  # PopScope.onPopInvokedWithResult, usado para el botón atrás, requiere 3.24.
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
